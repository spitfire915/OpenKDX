name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 ci/check-deps.py
      - name: Haxial blocklist (tree and every blob in the change)
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 ci/check-blocklist.py --range "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            python3 ci/check-blocklist.py --range "${{ github.event.before }}" "${{ github.sha }}"
          fi
      - run: for t in ci/*_test.py; do python3 -m unittest -v "$t"; done

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  lab:
    name: Lab (self-hosted)
    # Haxial binaries live only on the lab machine. Forked PRs must not run
    # there. This guard is a convenience only: a fork can edit this file. The
    # real protection is the repository setting that requires approval for
    # all outside collaborators' workflows (see lab/README.md).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lab]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test the original KDX Server in the sandbox
        run: |
          if [ -x lab/ci-smoke.sh ]; then lab/ci-smoke.sh; else echo "lab/ci-smoke.sh not yet present"; fi
      - name: Protocol tests with the KDX challenge table
        # The table is Haxial's text; it lives only here. Import it from the
        # server binary if the cache is empty, then hand it to the tests.
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo run -q -p openkdx-table -- path | grep -q "kdx.bin: present" \
            || cargo run -q -p openkdx-table -- import "$HOME/haxial/bin/KDXServer1620-Lnx/KDXServer1620-Lnx/KDXServer.lexe"
          export OPENKDX_KDX_TABLE="$(base64 -w0 "$(cargo run -q -p openkdx-table -- path | head -1)/kdx.bin")"
          cargo test -q -p openkdx-proto -p openkdx-codec -p openkdx-dissect

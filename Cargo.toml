[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spitfire915/OpenKDX"
rust-version = "1.96"

[workspace.dependencies]
# The kdx-* crates live in the fork spitfire915/kdx (spec §6.1); pinned by revision,
# patched to a sibling checkout for local work (CONTRIBUTING "Working on kdx-* and OpenKDX together").
kdx-proto = { git = "https://github.com/spitfire915/kdx", rev = "552114a62bdb2c5d1c9cd4b921373b70241282b7" }
kdx-codec = { git = "https://github.com/spitfire915/kdx", rev = "552114a62bdb2c5d1c9cd4b921373b70241282b7" }
kdx-client = { git = "https://github.com/spitfire915/kdx", rev = "552114a62bdb2c5d1c9cd4b921373b70241282b7" }
kdx-legacy = { git = "https://github.com/spitfire915/kdx", rev = "552114a62bdb2c5d1c9cd4b921373b70241282b7" }

openkdx-table = { path = "crates/openkdx-table", default-features = false }
openkdx-ui = { path = "crates/openkdx-ui" }

tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "6"
base64 = "0.22"
tempfile = "3"
hex = "0.4"
twofish = "0.8"
sha1 = "0.10"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures-util = "0.3"
pcap-file = "2"
etherparse = "0.21"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

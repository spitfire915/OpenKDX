[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spitfire915/OpenKDX"
rust-version = "1.85"

[workspace.dependencies]
openkdx-proto = { path = "crates/openkdx-proto" }
openkdx-codec = { path = "crates/openkdx-codec" }
openkdx-legacy = { path = "crates/openkdx-legacy" }
openkdx-table = { path = "crates/openkdx-table" }
openkdx-client = { path = "crates/openkdx-client" }
openkdx-server = { path = "crates/openkdx-server" }
openkdx-ui = { path = "crates/openkdx-ui" }

tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "6"
base64 = "0.22"
tempfile = "3"
hex = "0.4"

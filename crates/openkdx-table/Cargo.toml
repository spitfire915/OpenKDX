[package]
name = "openkdx-table"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Challenge tables: fetch, import, cache, and verify the Haxial stories."

[dependencies]
sha2.workspace = true
thiserror.workspace = true
directories.workspace = true
base64.workspace = true
clap.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, optional = true }
zip.workspace = true
hex.workspace = true
tempfile.workspace = true

[features]
default = ["fetch"]
# Download archives from the known mirrors. Off: no HTTP client in the graph;
# import and the cache still work.
fetch = ["dep:reqwest"]

[[bin]]
name = "openkdx-table"
path = "src/main.rs"
required-features = ["fetch"]

[dev-dependencies]
sha2.workspace = true
